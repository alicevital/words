<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mini Termo</title>
</head>
<body>

<h2>Jogo de Palavra</h2>

<input id="input" maxlength="5" placeholder="Digite 5 letras" />
<button onclick="enviar()">Enviar</button>

<div id="resultado"></div>

<script>
const API_URL = "http://127.0.0.1:8000";
const hoje = new Date().toISOString().slice(0, 10);

// carregar progresso
let progresso = JSON.parse(localStorage.getItem("termo")) || {};

if (!progresso[hoje]) {
  progresso[hoje] = {
    tentativas: [],
    venceu: false
  };
}

// mostrar histórico ao abrir
const resultadoDiv = document.getElementById("resultado");

function render() {
  resultadoDiv.innerHTML = "";

  progresso[hoje].tentativas.forEach(t => {
    const p = document.createElement("p");
    p.innerText = t;
    resultadoDiv.appendChild(p);
  });
}

render();

async function enviar() {
  const input = document.getElementById("input");
  const palavra = input.value.toLowerCase();

  if (palavra.length !== 5) {
    alert("Digite 5 letras");
    return;
  }

  if (progresso[hoje].venceu) {
    alert("Você já venceu hoje!");
    return;
  }

  try {
    const res = await fetch(API_URL + "/guess", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ palavra })
    });

    let data;

    try {
        data = await res.json();
    } catch {
        alert("Erro inesperado no servidor");
        return;
    }

    if (!res.ok) {
      alert(typeof data.detail == "string"
        ? data.detail
        : data.detail?.[0]?.msg || "Erro desconhecido"
      );

      return;
    }

    // salvar tentativa
    progresso[hoje].tentativas.push(palavra);

    // verificar vitória
    const venceu = data.resultado.every(r => r === "correct");

    if (venceu) {
      progresso[hoje].venceu = true;
      alert("Você venceu!");
    }

    // salvar no localStorage
    localStorage.setItem("termo", JSON.stringify(progresso));

    render();

    input.value = "";

  } catch (err) {
    alert("Erro ao conectar com API");
  }
}
</script>

</body>
</html>
